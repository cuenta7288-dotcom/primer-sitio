<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Cuentas de Google</title>
    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Fondo gris claro y centrado de la tarjeta */
        body {
            background-color: #f0f4f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Tarjeta contenedora principal (Dos columnas en PC) */
        .login-card {
            background-color: #ffffff;
            border-radius: 28px;
            width: 100%;
            max-width: 1040px;
            display: flex;
            padding: 40px;
            gap: 40px;
        }

        /* Sección Izquierda (Títulos) */
        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .logo {
            width: 40px;
            height: 40px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 36px;
            font-weight: 400;
            color: #1f1f1f;
            margin-bottom: 12px;
            line-height: 44px;
        }

        .subtitle {
            font-size: 16px;
            color: #1f1f1f;
        }

        /* Sección Derecha (Formulario e inputs) */
        .right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Empuja los botones siempre al fondo */
        }

        /* Contenedores de los campos */
        .input-group {
            position: relative;
            margin-top: 12px;
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            padding: 16px;
            border: 1px solid #747775;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            color: #1f1f1f;
            background: transparent;
        }

        .input-field:focus {
            border: 2px solid #0b57d0;
            padding: 15px; 
        }

        /* Animación de la etiqueta de texto flotante */
        .input-label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: #ffffff;
            padding: 0 4px;
            font-size: 16px;
            color: #444746;
            transition: 0.2s ease all;
            pointer-events: none;
        }

        .input-field:focus ~ .input-label,
        .input-field:not(:placeholder-shown) ~ .input-label {
            top: 0;
            font-size: 12px;
            color: #0b57d0;
        }

        .link {
            color: #0b57d0;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 24px;
            margin-top: 8px;
        }

        .link:hover {
            text-decoration: underline;
        }

        .guest-text {
            font-size: 14px;
            color: #444746;
            line-height: 20px;
            margin-bottom: 32px;
        }

        .guest-text a {
            color: #0b57d0;
            text-decoration: none;
            font-weight: 500;
        }

        /* Botones de acción inferiores */
        .action-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 24px;
        }

        .btn-secondary {
            color: #0b57d0;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 10px 12px;
            border-radius: 4px;
        }

        .btn-secondary:hover {
            background-color: #f0f4f9;
        }

        .btn-primary {
            background-color: #0b57d0;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: #0045ad;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        /* Control de Casilla de Ver Contraseña */
        .show-pass {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .show-pass input {
            width: 18px;
            height: 18px;
        }

        /* Pasos ocultos dinámicamente */
        .step-password {
            display: none;
        }

        /* Pie de página de Google */
        .footer {
            width: 100%;
            max-width: 1040px;
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #444746;
            padding: 0 24px;
        }

        .footer-left select {
            background: transparent;
            border: none;
            color: #444746;
            cursor: pointer;
        }

        .footer-right a {
            color: #444746;
            text-decoration: none;
            margin-left: 16px;
        }

        /* DISEÑO RESPONSIVO (MÓVIL AUTOMÁTICO) */
        @media (max-width: 768px) {
            body {
                background-color: #ffffff; /* En celulares Google quita el fondo gris */
                justify-content: flex-start;
                padding: 16px;
            }
            .login-card {
                flex-direction: column; /* Cambia a una sola columna */
                padding: 0px;
                gap: 24px;
            }
            .title {
                font-size: 24px;
                line-height: 32px;
            }
            .action-group {
                margin-top: 40px;
            }
            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                margin-top: 40px;
            }
            .footer-right {
                margin-left: 0;
            }
            .footer-right a {
                margin-left: 0;
                margin-right: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Tarjeta de Login -->
    <div class="login-card">
        
        <!-- Columna Izquierda -->
        <div class="left-section">
            <svg class="logo" viewBox="0 0 24 24" xmlns="http://w3.org">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            <h1 class="title" id="txtTitle">Accede a tu cuenta</h1>
            <p class="subtitle" id="txtSubtitle">Ir a Gmail</p>
        </div>

        <!-- Columna Derecha -->
        <div class="right-section">
            <form id="formGoogle" onsubmit="event.preventDefault(); cambiarPantalla();">
                
                <!-- PANTALLA 1: CORREO ELECTRONICO -->
                <div id="pantallaCorreo">
                    <div class="input-group">
                        <input type="text" id="correo" class="input-field" placeholder=" " required>
                        <label class="input-label">Correo electrónico o teléfono</label>
                    </div>
                    <a href="#" class="link">¿Olvidaste el correo electrónico?</a>
                    <p class="guest-text">
                        ¿Esta no es tu computadora? Usa el modo de invitado para navegar de forma privada. 
                        <a href="#">Más información para usar el modo de invitado</a>
                    </p>
                </div>

                <!-- PANTALLA 2: CONTRASEÑA -->
                <div id="pantallaPassword" class="step-password">
                    <div class="input-group">
                        <input type="password" id="clave" class="input-field" placeholder=" ">
                        <label class="input-label">Introduce tu contraseña</label>
                    </div>
                    <div class="show-pass">
                        <input type="checkbox" id="checkVer" onclick="toggleClave()">
                        <label for="checkVer" style="cursor: pointer;">Mostrar contraseña</label>
                    </div>
                    <a href="#" class="link">¿Olvidaste la contraseña?</a>
                </div>

                <!-- Botones Abajo -->
                <div class="action-group">
                    <button type="button" class="btn-secondary" id="btnIzquierdo">Crear cuenta</button>
                    <button type="submit" class="btn-primary" id="btnDerecho">Siguiente</button>
                </div>

            </form>
        </div>
    </div>

    <!-- Pie de página -->
    <div class="footer">
        <div class="footer-left">
            <select>
                <option>Español (Latinoamérica)</option>
                <option>English (United States)</option>
            </select>
        </div>
