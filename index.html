<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Formulario de Contacto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        form { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007BFF; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h2>Contáctanos</h2>

    <!-- Tu formulario conectado a Formspree -->
    <form action="https://formspree.io" method="POST">
        
        <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="name" required>
        </div>

        <div class="campo">
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="email" required>
        </div>

        <div class="campo">
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="message" rows="4" required></textarea>
        </div>

        <button type="submit">Enviar Mensaje</button>
    </form>

</body>
</html>
